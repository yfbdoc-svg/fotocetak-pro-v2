name: fotocetak_pro
description: Aplikasi desktop Windows untuk menyusun dan mencetak foto berukuran presisi.
publish_to: none
version: 0.4.1+5

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^13.1.0
  pdf: ^3.13.1
  printing: ^5.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
